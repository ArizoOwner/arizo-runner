<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#181336" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f3e8ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #c084fc;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1200" height="300" rx="16" fill="url(#glowPurple)" />
  <rect width="1200" height="300" rx="16" fill="url(#glowCyan)" />

  <!-- Subtle Tech Grid -->
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" />

  <!-- Decorative Top Banner Pill -->
  <g transform="translate(485, 42)">
    <rect width="230" height="28" rx="14" fill="#581c87" fill-opacity="0.4" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#22c55e" />
    <circle cx="16" cy="14" r="9" fill="#22c55e" fill-opacity="0.25" />
    <text x="32" y="19" class="badge-text">⚡ ARIZO ENTERPRISE</text>
  </g>

  <!-- Main Title & Logo Icon -->
  <g transform="translate(600, 120)" text-anchor="middle" filter="url(#shadow)">
    <text y="0" class="title">⚡ Arizo Telegram Self Manager</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text y="0" class="subtitle">Next-Gen Edge MTProto Engine • 2FA TOTP Security • Ghost Mode • AI Assistant Studio</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(180, 195)">
    <!-- Pill 1: Response Time -->
    <g transform="translate(0, 0)">
      <rect width="185" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-opacity="0.3" stroke-width="1" />
      <text x="92" y="23" text-anchor="middle" class="pill-text">⚡ Sub-40ms Engine</text>
    </g>

    <!-- Pill 2: Security -->
    <g transform="translate(205, 0)">
      <rect width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-opacity="0.3" stroke-width="1" />
      <text x="97" y="23" text-anchor="middle" class="pill-text">🛡️ 2FA &amp; Honeypot</text>
    </g>

    <!-- Pill 3: Serverless -->
    <g transform="translate(420, 0)">
      <rect width="200" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-opacity="0.3" stroke-width="1" />
      <text x="100" y="23" text-anchor="middle" class="pill-text">☁️ 100% Serverless Edge</text>
    </g>

    <!-- Pill 4: Web Studio -->
    <g transform="translate(640, 0)">
      <rect width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#64748b" stroke-opacity="0.3" stroke-width="1" />
      <text x="97" y="23" text-anchor="middle" class="pill-text">🎨 32+ Dynamic Fonts</text>
    </g>
  </g>

  <!-- Bottom Dynamic Wave -->
  <path d="M 0 270 Q 300 240 600 270 T 1200 260 L 1200 300 L 0 300 Z" fill="url(#waveGrad)" />
  <path d="M 0 282 Q 400 265 800 285 T 1200 275 L 1200 300 L 0 300 Z" fill="#0ea5e9" fill-opacity="0.3" />
</svg>
